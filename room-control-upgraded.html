<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Room</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.dashboard{max-width:1100px;margin:auto;padding:40px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:35px}
h1{margin:0;font-size:38px}
.sub{color:#888;margin-top:6px}
.clock{text-align:right;font-size:32px;font-weight:650}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.tile{
  border:1px solid #e5e5e7;
  background:white;
  border-radius:27px;
  min-height:190px;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  box-shadow:0 7px 25px rgba(0,0,0,.04);
}
.tile:active{transform:scale(.98)}
.icon{font-size:35px}
.name{font-size:22px;font-weight:650}
.status{font-size:14px;color:#888;margin-top:5px}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.overlay.show{display:flex}

.popup{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:30px;
  padding:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.2);
}
.popup-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.popup-header h2{margin:0}
.close{
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

/* MUSIC */

.connect{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  margin-top:24px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:650;
  cursor:pointer;
}

.spotifyConnected{
  display:flex;
  align-items:center;
  gap:8px;
  color:#16883c;
  font-size:14px;
  margin-top:15px;
}

.searchBox{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.searchBox input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  background:#f5f5f7;
  border-radius:15px;
  padding:15px;
  font-size:16px;
  outline:none;
}
.searchBox button{
  border:0;
  border-radius:15px;
  background:#111;
  color:white;
  padding:0 20px;
  font-weight:650;
}

.results{margin-top:14px}

.song{
  width:100%;
  border:0;
  background:white;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px;
  border-radius:14px;
  text-align:left;
  cursor:pointer;
}
.song:hover{background:#f5f5f7}
.song img{
  width:52px;
  height:52px;
  border-radius:8px;
  object-fit:cover;
}
.songText{min-width:0;flex:1}
.songName{
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.artist{
  color:#888;
  font-size:13px;
  margin-top:3px;
}

.nowPlaying{
  margin-top:24px;
  background:#f5f5f7;
  border-radius:22px;
  padding:18px;
}
.nowTop{
  display:flex;
  align-items:center;
  gap:15px;
}
.nowTop img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:12px;
}
.label{
  color:#888;
  font-size:11px;
  letter-spacing:1px;
  font-weight:700;
}
#nowTitle{
  font-size:18px;
  font-weight:700;
  margin-top:5px;
}
#nowArtist{
  color:#777;
  font-size:14px;
  margin-top:4px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}
.controls button{
  height:54px;
  border:0;
  border-radius:16px;
  background:white;
  font-size:21px;
  cursor:pointer;
}

.volume{margin-top:18px}
.volume input{width:100%}

.message{
  color:#777;
  font-size:14px;
  margin-top:15px;
}


/* HYBRID SPOTIFY PLAYER */
.musicShell{position:relative;overflow:hidden;margin-top:16px;border-radius:26px}
.musicGlow{position:absolute;inset:-45px;background-position:center;background-size:cover;filter:blur(55px);opacity:.16;transform:scale(1.18);pointer-events:none}
.musicInner{position:relative;z-index:1}
.results:not(:empty){max-height:255px;overflow:auto;background:#fff;border:1px solid #ececef;border-radius:18px;padding:6px}
.playerCard{margin-top:18px;text-align:center;background:rgba(245,245,247,.92);border-radius:26px;padding:24px 22px 20px}
.playerCover{display:block;width:min(330px,72vw);aspect-ratio:1/1;object-fit:cover;margin:0 auto 20px;border-radius:22px;background:#e6e6e8;box-shadow:0 16px 45px rgba(0,0,0,.14)}
.playerTitle{font-size:25px;line-height:1.15;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playerArtist{color:#777;font-size:15px;margin-top:6px}
.progressRow{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin-top:20px;color:#777;font-size:12px}
.progressRow input,.volumeRow input{width:100%}
.playerControls{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:18px}
.playerControls button{border:0;background:transparent;font-size:28px;min-width:52px;height:52px;cursor:pointer}
.playerControls .mainPlay{width:66px;height:66px;border-radius:50%;background:#111;color:#fff;font-size:25px}
.volumeRow{display:grid;grid-template-columns:26px 1fr 26px;align-items:center;gap:8px;margin-top:16px}
.deviceLine{color:#777;font-size:13px;margin-top:15px}
.activate{margin-top:14px;border:0;border-radius:14px;padding:12px 16px;background:#fff;font-weight:650;cursor:pointer}
@media(max-width:800px){.popup{padding:20px}.playerCard{padding:18px 14px}.playerCover{width:min(300px,70vw)}}

.generic{
  margin-top:25px;
  color:#777;
}

@media(max-width:800px){
  .dashboard{padding:25px 18px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{min-height:160px;padding:19px}
  h1{font-size:30px}
  .clock{font-size:25px}
}
</style>
</head>

<body>

<main class="dashboard">

<header>
<div>
<h1>My Room</h1>
<div class="sub" id="date"></div>
</div>

<div class="clock">
<div id="clock"></div>
<div class="sub">● Room system online</div>
</div>
</header>

<section class="grid">

<button class="tile" onclick="openPanel('ai')">
<div class="icon">🤖</div>
<div><div class="name">AI Assistant</div><div class="status">Ready</div></div>
</button>

<button class="tile" onclick="openPanel('ac')">
<div class="icon">❄️</div>
<div><div class="name">AC</div><div class="status">22°C</div></div>
</button>

<button class="tile" onclick="openPanel('lights')">
<div class="icon">💡</div>
<div><div class="name">Lights</div><div class="status">Off</div></div>
</button>

<button class="tile" onclick="openPanel('pc')">
<div class="icon">🖥️</div>
<div><div class="name">PC</div><div class="status">Online</div></div>
</button>

<button class="tile" onclick="openPanel('projector')">
<div class="icon">📽️</div>
<div><div class="name">Projector</div><div class="status">Off</div></div>
</button>

<button class="tile" onclick="openPanel('music')">
<div class="icon">🎵</div>
<div>
<div class="name">Music</div>
<div class="status" id="musicTileStatus">Spotify</div>
</div>
</button>

</section>
</main>

<div class="overlay" id="overlay">
<div class="popup">

<div class="popup-header">
<h2 id="panelTitle"></h2>
<button class="close" onclick="closePanel()">✕</button>
</div>

<div id="panelContent"></div>

</div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>

/* ================================
   CONFIG
================================ */

const CLIENT_ID =
"2e618d699b024205821a0086f9460e8a";

const REDIRECT_URI =
"https://camilolluberes.github.io/room-control/";

const SCOPES =
"streaming user-read-playback-state user-modify-playback-state user-read-currently-playing";


/* ================================
   CLOCK
================================ */

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  document.getElementById("date").textContent=
    now.toLocaleDateString([],{
      weekday:"long",
      month:"long",
      day:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);


/* ================================
   POPUP
================================ */

const overlay=document.getElementById("overlay");
const panelTitle=document.getElementById("panelTitle");
const panelContent=document.getElementById("panelContent");

function closePanel(){
  overlay.classList.remove("show");
}

overlay.addEventListener("click",e=>{
  if(e.target===overlay) closePanel();
});


function openPanel(type){

  overlay.classList.add("show");

  if(type==="music"){
    showMusic();
    return;
  }

  const names={
    ai:"🤖 AI Assistant",
    ac:"❄️ Air Conditioner",
    lights:"💡 Lights",
    pc:"🖥️ PC",
    projector:"📽️ Projector"
  };

  panelTitle.textContent=names[type];

  panelContent.innerHTML=`
    <div class="generic">
      We'll connect this control after Music is finished.
    </div>
  `;
}


/* ================================
   MUSIC UI
================================ */

function showMusic(){
  panelTitle.textContent="🎵 Music";
  const token=sessionStorage.getItem("spotify_token");
  if(!token){
    panelContent.innerHTML=`
      <button class="connect" onclick="spotifyLogin()">Connect Spotify</button>
      <div class="message">Connect Spotify once, then this dashboard can become its own Spotify player.</div>`;
    return;
  }
  panelContent.innerHTML=`
    <div class="spotifyConnected">● Spotify connected</div>
    <div class="musicShell">
      <div class="musicGlow" id="musicGlow"></div>
      <div class="musicInner">
        <div class="searchBox">
          <input id="spotifySearch" placeholder="Search songs..." onkeydown="if(event.key==='Enter') searchSpotify()">
          <button onclick="searchSpotify()">Search</button>
        </div>
        <div id="results" class="results"></div>
        <div class="playerCard">
          <img id="nowCover" class="playerCover" src="" alt="" style="display:none">
          <div class="label">NOW PLAYING</div>
          <div id="nowTitle" class="playerTitle">Nothing playing</div>
          <div id="nowArtist" class="playerArtist">Spotify</div>
          <div class="progressRow">
            <span id="elapsedTime">0:00</span>
            <input id="progressBar" type="range" min="0" max="1000" value="0" oninput="previewSeek(this.value)" onchange="seekTrack(this.value)">
            <span id="totalTime">0:00</span>
          </div>
          <div class="playerControls">
            <button onclick="previousTrack()">⏮</button>
            <button id="playButton" class="mainPlay" onclick="togglePlayback()">▶</button>
            <button onclick="nextTrack()">⏭</button>
          </div>
          <div class="volumeRow">
            <span>🔉</span>
            <input id="volumeSlider" type="range" min="0" max="100" value="50" oninput="setVolume(this.value)">
            <span>🔊</span>
          </div>
          <div id="deviceLine" class="deviceLine">Player: connecting Room Control…</div>
          <button class="activate" onclick="activateRoomPlayer()">▶ Activate Room Control</button>
        </div>
        <button class="connect" onclick="openHomePod()">🔊 Spotify → HomePod</button>
        <div id="spotifyMessage" class="message"></div>
      </div>
    </div>`;
  ensureSpotifyPlayer();
  updateNowPlaying();
}

/* ================================
   PKCE HELPERS
================================ */

function randomString(length){

  const chars=
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result="";

  const values=
    crypto.getRandomValues(
      new Uint8Array(length)
    );

  values.forEach(v=>{
    result+=chars[v%chars.length];
  });

  return result;
}


async function sha256(text){

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );

}


function base64url(buffer){

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/\+/g,"-")
  .replace(/\//g,"_")
  .replace(/=+$/,"");
}


/* ================================
   SPOTIFY LOGIN
================================ */

async function spotifyLogin(){

  const verifier=randomString(64);

  sessionStorage.setItem(
    "spotify_verifier",
    verifier
  );

  const challenge=
    base64url(
      await sha256(verifier)
    );

  const params=
    new URLSearchParams({
      client_id:CLIENT_ID,
      response_type:"code",
      redirect_uri:REDIRECT_URI,
      scope:SCOPES,
      code_challenge_method:"S256",
      code_challenge:challenge
    });

  location.href=
    "https://accounts.spotify.com/authorize?"
    +params.toString();
}


/* ================================
   HANDLE SPOTIFY RETURN
================================ */

async function handleSpotifyReturn(){

  const params=
    new URLSearchParams(
      location.search
    );

  const code=params.get("code");

  if(!code) return;

  const verifier=
    sessionStorage.getItem(
      "spotify_verifier"
    );

  if(!verifier) return;


  const body=
    new URLSearchParams({
      client_id:CLIENT_ID,
      grant_type:"authorization_code",
      code:code,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    });


  const response=
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:body
      }
    );


  const data=
    await response.json();


  if(data.access_token){

    sessionStorage.setItem(
      "spotify_token",
      data.access_token
    );
history.replaceState(
      {},
      "",
      REDIRECT_URI
    );

    document.getElementById(
      "musicTileStatus"
    ).textContent=
      "Connected";

    openPanel("music");
  }
}


/* ================================
   SPOTIFY API
================================ */

async function spotifyAPI(
  endpoint,
  options={}
){

  const token = sessionStorage.getItem("spotify_token");

  if(!token){
    showMusic();
    return null;
  }

  options.headers={
    ...(options.headers||{}),
    Authorization:
      "Bearer "+token
  };


  const response=
    await fetch(
      "https://api.spotify.com/v1"+endpoint,
      options
    );


  if(response.status===401){

    sessionStorage.removeItem(
      "spotify_token"
    );

    showMusic();

    return null;
  }


  if(response.status===204){
    return {};
  }


  if(!response.ok){

    const message=
      document.getElementById(
        "spotifyMessage"
      );

    if(message){
      message.textContent=
        "Spotify couldn't perform that action.";
    }

    return null;
  }


  return response.json();
}


/* ================================
   SEARCH
================================ */

async function searchSpotify(){

  const input=
    document.getElementById(
      "spotifySearch"
    );

  const query=input.value.trim();

  if(!query) return;


  const results=
    document.getElementById(
      "results"
    );

  results.innerHTML=
    `<div class="message">Searching...</div>`;


  const data=
    await spotifyAPI(
      "/search?q="+
      encodeURIComponent(query)+
      "&type=track&limit=8"
    );


  if(!data) return;


  results.innerHTML="";


  data.tracks.items.forEach(track=>{

    const button=
      document.createElement("button");

    button.className="song";


    const image=
      track.album.images[0]
      ? track.album.images[0].url
      : "";


    button.innerHTML=`

      <img src="${image}" alt="">

      <div class="songText">

        <div class="songName">
          ${escapeHTML(track.name)}
        </div>

        <div class="artist">
          ${escapeHTML(
            track.artists
            .map(a=>a.name)
            .join(", ")
          )}
        </div>

      </div>

      <div>▶</div>
    `;


    button.onclick=async()=>{
      await activateRoomPlayer();
      await playTrack(track.uri);
      results.innerHTML="";
      input.value="";
    };


    results.appendChild(button);

  });
}


/* ================================
   PLAY SONG
================================ */

async function playTrack(uri){
  if(!spotifyDeviceId) await ensureSpotifyPlayer();
  const target=spotifyDeviceId ? "?device_id="+encodeURIComponent(spotifyDeviceId) : "";
  await spotifyAPI("/me/player/play"+target,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uris:[uri]})
  });
  setTimeout(updateNowPlaying,600);
}

/* ================================
   PLAY / PAUSE
================================ */

async function togglePlayback(){
  if(spotifyPlayer && spotifyDeviceId){
    await spotifyPlayer.activateElement().catch(()=>{});
    await spotifyPlayer.togglePlay();
    setTimeout(updateNowPlaying,250);
    return;
  }
  const state=await spotifyAPI("/me/player");
  if(!state) return;
  if(state.is_playing) await spotifyAPI("/me/player/pause",{method:"PUT"});
  else await spotifyAPI("/me/player/play",{method:"PUT"});
  setTimeout(updateNowPlaying,300);
}

/* ================================
   NEXT / PREVIOUS
================================ */

async function nextTrack(){
  if(spotifyPlayer && spotifyDeviceId) await spotifyPlayer.nextTrack();
  else await spotifyAPI("/me/player/next",{method:"POST"});
  setTimeout(updateNowPlaying,400);
}
async function previousTrack(){
  if(spotifyPlayer && spotifyDeviceId) await spotifyPlayer.previousTrack();
  else await spotifyAPI("/me/player/previous",{method:"POST"});
  setTimeout(updateNowPlaying,400);
}

/* ================================
   VOLUME
================================ */

async function setVolume(value){
  if(spotifyPlayer && spotifyDeviceId){
    try{ await spotifyPlayer.setVolume(Number(value)/100); return; }catch(e){}
  }
  await spotifyAPI("/me/player/volume?volume_percent="+value+(spotifyDeviceId ? "&device_id="+encodeURIComponent(spotifyDeviceId) : ""),{method:"PUT"});
}

/* ================================
   NOW PLAYING
================================ */

function formatTime(ms){
  if(!Number.isFinite(ms)||ms<0) return "0:00";
  const seconds=Math.floor(ms/1000);
  return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
}
function paintPlayer(item,isPlaying,position=0,duration=0){
  const title=document.getElementById("nowTitle"); if(!title) return;
  if(!item){title.textContent="Nothing playing";document.getElementById("nowArtist").textContent="Spotify";return;}
  title.textContent=item.name||"Unknown track";
  document.getElementById("nowArtist").textContent=(item.artists||[]).map(a=>a.name).join(", ")||"Spotify";
  const images=(item.album&&item.album.images)||[];
  const image=images.length?images[0].url:"";
  const cover=document.getElementById("nowCover");
  if(image&&cover){cover.src=image;cover.style.display="block";const glow=document.getElementById("musicGlow");if(glow)glow.style.backgroundImage=`url("${image}")`;}
  const play=document.getElementById("playButton");if(play)play.textContent=isPlaying?"❚❚":"▶";
  const bar=document.getElementById("progressBar");
  if(bar&&duration){bar.value=Math.max(0,Math.min(1000,(position/duration)*1000));bar.dataset.duration=duration;}
  const elapsed=document.getElementById("elapsedTime"),total=document.getElementById("totalTime");
  if(elapsed)elapsed.textContent=formatTime(position);if(total)total.textContent=formatTime(duration);
}
async function updateNowPlaying(){
  if(!document.getElementById("nowTitle"))return;
  if(spotifyPlayer&&spotifyDeviceId){
    const local=await spotifyPlayer.getCurrentState().catch(()=>null);
    if(local&&local.track_window&&local.track_window.current_track){
      paintPlayer(local.track_window.current_track,!local.paused,local.position,local.duration);return;
    }
  }
  const state=await spotifyAPI("/me/player");
  if(!state||!state.item){paintPlayer(null,false,0,0);return;}
  paintPlayer(state.item,state.is_playing,state.progress_ms||0,state.item.duration_ms||0);
}
function previewSeek(value){
  const bar=document.getElementById("progressBar"),elapsed=document.getElementById("elapsedTime");
  if(!bar||!elapsed)return;const duration=Number(bar.dataset.duration||0);elapsed.textContent=formatTime(duration*(Number(value)/1000));
}
async function seekTrack(value){
  const bar=document.getElementById("progressBar");if(!bar)return;
  const duration=Number(bar.dataset.duration||0),position=Math.round(duration*(Number(value)/1000));
  if(spotifyPlayer&&spotifyDeviceId)await spotifyPlayer.seek(position);
  else await spotifyAPI("/me/player/seek?position_ms="+position,{method:"PUT"});
}

/* WEB PLAYBACK SDK */
let spotifyPlayer=null,spotifyDeviceId=null,spotifyPlayerPromise=null;
function waitForSpotifySDK(){
  if(window.Spotify)return Promise.resolve();
  return new Promise(resolve=>{window.onSpotifyWebPlaybackSDKReady=()=>resolve();});
}
async function ensureSpotifyPlayer(){
  const token=sessionStorage.getItem("spotify_token");if(!token)return false;
  if(spotifyPlayer&&spotifyDeviceId)return true;if(spotifyPlayerPromise)return spotifyPlayerPromise;
  spotifyPlayerPromise=(async()=>{
    await waitForSpotifySDK();
    spotifyPlayer=new Spotify.Player({
      name:"Room Control",
      getOAuthToken:cb=>cb(sessionStorage.getItem("spotify_token")||""),
      volume:0.5,
      enableMediaSession:true
    });
    spotifyPlayer.addListener("ready",({device_id})=>{
      spotifyDeviceId=device_id;
      const line=document.getElementById("deviceLine");if(line)line.textContent="Playing on: Room Control";
      const slider=document.getElementById("volumeSlider");
      if(slider)spotifyPlayer.getVolume().then(v=>slider.value=Math.round(v*100)).catch(()=>{});
    });
    spotifyPlayer.addListener("not_ready",({device_id})=>{if(device_id===spotifyDeviceId)spotifyDeviceId=null;});
    spotifyPlayer.addListener("player_state_changed",state=>{if(state)paintPlayer(state.track_window.current_track,!state.paused,state.position,state.duration);});
    const showErr=({message})=>{const el=document.getElementById("spotifyMessage");if(el)el.textContent=message;console.error(message);};
    spotifyPlayer.addListener("initialization_error",showErr);
    spotifyPlayer.addListener("authentication_error",showErr);
    spotifyPlayer.addListener("account_error",showErr);
    spotifyPlayer.addListener("playback_error",showErr);
    spotifyPlayer.addListener("autoplay_failed",()=>{const el=document.getElementById("spotifyMessage");if(el)el.textContent="Tap Activate Room Control once to allow audio on this iPad.";});
    return await spotifyPlayer.connect();
  })();
  const result=await spotifyPlayerPromise;spotifyPlayerPromise=null;return result;
}
async function activateRoomPlayer(){
  await ensureSpotifyPlayer();if(!spotifyPlayer)return;
  await spotifyPlayer.activateElement().catch(()=>{});
  if(spotifyDeviceId){
    await spotifyAPI("/me/player",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({device_ids:[spotifyDeviceId],play:false})
    });
    const line=document.getElementById("deviceLine");if(line)line.textContent="Playing on: Room Control";
  }
}
