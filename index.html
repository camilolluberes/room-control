<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Room</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.dashboard{max-width:1100px;margin:auto;padding:40px}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:35px}
h1{margin:0;font-size:38px}
.sub{color:#888;margin-top:6px}
.clock{text-align:right;font-size:32px;font-weight:650}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.tile{
  border:1px solid #e5e5e7;
  background:white;
  border-radius:27px;
  min-height:190px;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  box-shadow:0 7px 25px rgba(0,0,0,.04);
}
.tile:active{transform:scale(.98)}
.icon{font-size:35px}
.name{font-size:22px;font-weight:650}
.status{font-size:14px;color:#888;margin-top:5px}

/* POPUP */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.overlay.show{display:flex}

.popup{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:30px;
  padding:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.2);
}
.popup-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.popup-header h2{margin:0}
.close{
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

/* MUSIC */

.connect{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  margin-top:24px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:650;
  cursor:pointer;
}

.spotifyConnected{
  display:flex;
  align-items:center;
  gap:8px;
  color:#16883c;
  font-size:14px;
  margin-top:15px;
}

.searchBox{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.searchBox input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  background:#f5f5f7;
  border-radius:15px;
  padding:15px;
  font-size:16px;
  outline:none;
}
.searchBox button{
  border:0;
  border-radius:15px;
  background:#111;
  color:white;
  padding:0 20px;
  font-weight:650;
}

.results{margin-top:14px}

.song{
  width:100%;
  border:0;
  background:white;
  display:flex;
  align-items:center;
  gap:13px;
  padding:10px;
  border-radius:14px;
  text-align:left;
  cursor:pointer;
}
.song:hover{background:#f5f5f7}
.song img{
  width:52px;
  height:52px;
  border-radius:8px;
  object-fit:cover;
}
.songText{min-width:0;flex:1}
.songName{
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.artist{
  color:#888;
  font-size:13px;
  margin-top:3px;
}

.nowPlaying{
  margin-top:24px;
  background:#f5f5f7;
  border-radius:22px;
  padding:18px;
}
.nowTop{
  display:flex;
  align-items:center;
  gap:15px;
}
.nowTop img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:12px;
}
.label{
  color:#888;
  font-size:11px;
  letter-spacing:1px;
  font-weight:700;
}
#nowTitle{
  font-size:18px;
  font-weight:700;
  margin-top:5px;
}
#nowArtist{
  color:#777;
  font-size:14px;
  margin-top:4px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}
.controls button{
  height:54px;
  border:0;
  border-radius:16px;
  background:white;
  font-size:21px;
  cursor:pointer;
}

.volume{margin-top:18px}
.volume input{width:100%}

.message{
  color:#777;
  font-size:14px;
  margin-top:15px;
}

.generic{
  margin-top:25px;
  color:#777;
}

@media(max-width:800px){
  .dashboard{padding:25px 18px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{min-height:160px;padding:19px}
  h1{font-size:30px}
  .clock{font-size:25px}
}
</style>
</head>

<body>

<main class="dashboard">

<header>
<div>
<h1>My Room</h1>
<div class="sub" id="date"></div>
</div>

<div class="clock">
<div id="clock"></div>
<div class="sub">● Room system online</div>
</div>
</header>

<section class="grid">

<button class="tile" onclick="openPanel('ai')">
<div class="icon">🤖</div>
<div><div class="name">AI Assistant</div><div class="status">Ready</div></div>
</button>

<button class="tile" onclick="openPanel('ac')">
<div class="icon">❄️</div>
<div><div class="name">AC</div><div class="status">22°C</div></div>
</button>

<button class="tile" onclick="openPanel('lights')">
<div class="icon">💡</div>
<div><div class="name">Lights</div><div class="status">Off</div></div>
</button>

<button class="tile" onclick="openPanel('pc')">
<div class="icon">🖥️</div>
<div><div class="name">PC</div><div class="status">Online</div></div>
</button>

<button class="tile" onclick="openPanel('projector')">
<div class="icon">📽️</div>
<div><div class="name">Projector</div><div class="status">Off</div></div>
</button>

<button class="tile" onclick="openPanel('music')">
<div class="icon">🎵</div>
<div>
<div class="name">Music</div>
<div class="status" id="musicTileStatus">Spotify</div>
</div>
</button>

</section>
</main>

<div class="overlay" id="overlay">
<div class="popup">

<div class="popup-header">
<h2 id="panelTitle"></h2>
<button class="close" onclick="closePanel()">✕</button>
</div>

<div id="panelContent"></div>

</div>
</div>

<script>

/* ================================
   CONFIG
================================ */

const CLIENT_ID =
"2e618d699b024205821a0086f9460e8a";

const REDIRECT_URI =
"https://camilolluberes.github.io/room-control/";

const SCOPES =
"user-read-playback-state user-modify-playback-state user-read-currently-playing";


/* ================================
   CLOCK
================================ */

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  document.getElementById("date").textContent=
    now.toLocaleDateString([],{
      weekday:"long",
      month:"long",
      day:"numeric"
    });
}

updateClock();
setInterval(updateClock,1000);


/* ================================
   POPUP
================================ */

const overlay=document.getElementById("overlay");
const panelTitle=document.getElementById("panelTitle");
const panelContent=document.getElementById("panelContent");

function closePanel(){
  overlay.classList.remove("show");
}

overlay.addEventListener("click",e=>{
  if(e.target===overlay) closePanel();
});


function openPanel(type){

  overlay.classList.add("show");

  if(type==="music"){
    showMusic();
    return;
  }

  const names={
    ai:"🤖 AI Assistant",
    ac:"❄️ Air Conditioner",
    lights:"💡 Lights",
    pc:"🖥️ PC",
    projector:"📽️ Projector"
  };

  panelTitle.textContent=names[type];

  panelContent.innerHTML=`
    <div class="generic">
      We'll connect this control after Music is finished.
    </div>
  `;
}


/* ================================
   MUSIC UI
================================ */

function showMusic(){

  panelTitle.textContent="🎵 Music";

  const token=sessionStorage.getItem("spotify_token");

  if(!token){

    panelContent.innerHTML=`
      <button class="connect" onclick="spotifyLogin()">
        Connect Spotify
      </button>

      <div class="message">
        Connect your Spotify account to search and control music.
      </div>
    `;

    return;
  }

  panelContent.innerHTML=`

    <div class="spotifyConnected">
      ● Spotify connected
    </div>

    <div class="searchBox">
      <input
        id="spotifySearch"
        placeholder="Search songs..."
        onkeydown="if(event.key==='Enter') searchSpotify()"
      >

      <button onclick="searchSpotify()">
        Search
      </button>
    </div>

    <div id="results" class="results"></div>

    <div class="nowPlaying">

      <div class="nowTop">

        <img
          id="nowCover"
          src=""
          alt=""
          style="display:none"
        >

        <div>
          <div class="label">NOW PLAYING</div>
          <div id="nowTitle">Nothing playing</div>
          <div id="nowArtist">Spotify</div>
        </div>

      </div>

      <div class="controls">

        <button onclick="previousTrack()">⏮</button>

        <button
          id="playButton"
          onclick="togglePlayback()"
        >
          ▶
        </button>

        <button onclick="nextTrack()">⏭</button>

      </div>

      <div class="volume">

        <input
          type="range"
          min="0"
          max="100"
          value="50"
          onchange="setVolume(this.value)"
        >

      </div>

    </div>

    <button
      class="connect"
      onclick="openHomePod()"
    >
      🔊 Spotify → HomePod
    </button>

    <div id="spotifyMessage" class="message"></div>

  `;

  updateNowPlaying();
}


/* ================================
   PKCE HELPERS
================================ */

function randomString(length){

  const chars=
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result="";

  const values=
    crypto.getRandomValues(
      new Uint8Array(length)
    );

  values.forEach(v=>{
    result+=chars[v%chars.length];
  });

  return result;
}


async function sha256(text){

  return crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(text)
  );

}


function base64url(buffer){

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buffer)
    )
  )
  .replace(/\+/g,"-")
  .replace(/\//g,"_")
  .replace(/=+$/,"");
}


/* ================================
   SPOTIFY LOGIN
================================ */

async function spotifyLogin(){

  const verifier=randomString(64);

  sessionStorage.setItem(
    "spotify_verifier",
    verifier
  );

  const challenge=
    base64url(
      await sha256(verifier)
    );

  const params=
    new URLSearchParams({
      client_id:CLIENT_ID,
      response_type:"code",
      redirect_uri:REDIRECT_URI,
      scope:SCOPES,
      code_challenge_method:"S256",
      code_challenge:challenge
    });

  location.href=
    "https://accounts.spotify.com/authorize?"
    +params.toString();
}


/* ================================
   HANDLE SPOTIFY RETURN
================================ */

async function handleSpotifyReturn(){

  const params=
    new URLSearchParams(
      location.search
    );

  const code=params.get("code");

  if(!code) return;

  const verifier=
    sessionStorage.getItem(
      "spotify_verifier"
    );

  if(!verifier) return;


  const body=
    new URLSearchParams({
      client_id:CLIENT_ID,
      grant_type:"authorization_code",
      code:code,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    });


  const response=
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method:"POST",
        headers:{
          "Content-Type":
          "application/x-www-form-urlencoded"
        },
        body:body
      }
    );


  const data=
    await response.json();


  if(data.access_token){

    sessionStorage.setItem(
      "spotify_token",
      data.access_token
    );

     fetch("http://192.168.0.44:5000/token", {
      method: "POST",
     headers: {"Content-Type": "application/json"},
     body: JSON.stringify({token: data.access_token})
     });

    history.replaceState(
      {},
      "",
      REDIRECT_URI
    );

    document.getElementById(
      "musicTileStatus"
    ).textContent=
      "Connected";

    openPanel("music");
  }
}


/* ================================
   SPOTIFY API
================================ */

async function spotifyAPI(
  endpoint,
  options={}
){

  let token = sessionStorage.getItem("spotify_token");

  if (!token) {
  const response = await fetch("http://192.168.0.44:5000/token");
  const data = await response.json();
  token = data.token;

  if (token) {
    sessionStorage.setItem("spotify_token", token);
  }
}

  if(!token){
    showMusic();
    return null;
  }

  options.headers={
    ...(options.headers||{}),
    Authorization:
      "Bearer "+token
  };


  const response=
    await fetch(
      "https://api.spotify.com/v1"+endpoint,
      options
    );


  if(response.status===401){

    sessionStorage.removeItem(
      "spotify_token"
    );

    showMusic();

    return null;
  }


  if(response.status===204){
    return {};
  }


  if(!response.ok){

    const message=
      document.getElementById(
        "spotifyMessage"
      );

    if(message){
      message.textContent=
        "Spotify couldn't perform that action.";
    }

    return null;
  }


  return response.json();
}


/* ================================
   SEARCH
================================ */

async function searchSpotify(){

  const input=
    document.getElementById(
      "spotifySearch"
    );

  const query=input.value.trim();

  if(!query) return;


  const results=
    document.getElementById(
      "results"
    );

  results.innerHTML=
    `<div class="message">Searching...</div>`;


  const data=
    await spotifyAPI(
      "/search?q="+
      encodeURIComponent(query)+
      "&type=track&limit=8"
    );


  if(!data) return;


  results.innerHTML="";


  data.tracks.items.forEach(track=>{

    const button=
      document.createElement("button");

    button.className="song";


    const image=
      track.album.images[0]
      ? track.album.images[0].url
      : "";


    button.innerHTML=`

      <img src="${image}" alt="">

      <div class="songText">

        <div class="songName">
          ${escapeHTML(track.name)}
        </div>

        <div class="artist">
          ${escapeHTML(
            track.artists
            .map(a=>a.name)
            .join(", ")
          )}
        </div>

      </div>

      <div>▶</div>
    `;


    button.onclick=()=>{
      playTrack(track.uri);
    };


    results.appendChild(button);

  });
}


/* ================================
   PLAY SONG
================================ */

async function playTrack(uri){

  await spotifyAPI(
    "/me/player/play",
    {
      method:"PUT",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({
        uris:[uri]
      })
    }
  );

  setTimeout(
    updateNowPlaying,
    600
  );
}


/* ================================
   PLAY / PAUSE
================================ */

async function togglePlayback(){

  const state=
    await spotifyAPI(
      "/me/player"
    );

  if(!state) return;


  if(state.is_playing){

    await spotifyAPI(
      "/me/player/pause",
      {method:"PUT"}
    );

  }else{

    await spotifyAPI(
      "/me/player/play",
      {method:"PUT"}
    );

  }

  setTimeout(
    updateNowPlaying,
    300
  );
}


/* ================================
   NEXT / PREVIOUS
================================ */

async function nextTrack(){

  await spotifyAPI(
    "/me/player/next",
    {method:"POST"}
  );

  setTimeout(
    updateNowPlaying,
    500
  );
}


async function previousTrack(){

  await spotifyAPI(
    "/me/player/previous",
    {method:"POST"}
  );

  setTimeout(
    updateNowPlaying,
    500
  );
}


/* ================================
   VOLUME
================================ */

async function setVolume(value){

  await spotifyAPI(
    "/me/player/volume?volume_percent="
    +value,
    {
      method:"PUT"
    }
  );
}


/* ================================
   NOW PLAYING
================================ */

async function updateNowPlaying(){

  const title=
    document.getElementById(
      "nowTitle"
    );

  if(!title) return;


  const state=
    await spotifyAPI(
      "/me/player"
    );


  if(!state || !state.item){

    title.textContent=
      "Nothing playing";

    return;
  }


  title.textContent=
    state.item.name;


  document.getElementById(
    "nowArtist"
  ).textContent=
    state.item.artists
    .map(a=>a.name)
    .join(", ");


  const cover=
    document.getElementById(
      "nowCover"
    );


  if(
    state.item.album &&
    state.item.album.images.length
  ){

    cover.src=
      state.item.album.images[0].url;

    cover.style.display="block";
  }


  document.getElementById(
    "playButton"
  ).textContent=
    state.is_playing
    ? "❚❚"
    : "▶";
}


/* ================================
   HOMEPOD SHORTCUT
================================ */

function openHomePod(){

  location.href=
    "shortcuts://run-shortcut?name=Spotify%20HomePod";

}


/* ================================
   SAFETY FOR SEARCH TEXT
================================ */

function escapeHTML(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}


/* ================================
   START
================================ */

handleSpotifyReturn();

setInterval(()=>{

  if(
    overlay.classList.contains("show") &&
    document.getElementById("nowTitle")
  ){
    updateNowPlaying();
  }

},5000);

</script>

</body>
</html>
